services:

  mysql:

    image: mysql:8.4

    container_name: karan-devops-mysql

    environment:

      MYSQL_DATABASE: ${MYSQL_DATABASE:-karan_dashboard}

      MYSQL_USER: ${MYSQL_USER:-karan}

      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-karanpassword}

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"
        ]

      interval: 10s

      timeout: 5s

      retries: 10

      start_period: 20s

    restart: unless-stopped


  app:

    build:
      context: .

    image: karan-devops-dashboard:local

    container_name: karan-devops-app

    ports:

      - "5000:5000"

    environment:

      APP_NAME: Karan DevOps Dashboard

      APP_VERSION: 2.0.0

      ENVIRONMENT: docker-compose

      DB_HOST: mysql

      DB_PORT: 3306

      DB_NAME: ${MYSQL_DATABASE:-karan_dashboard}

      DB_USER: ${MYSQL_USER:-karan}

      DB_PASSWORD: ${MYSQL_PASSWORD:-karanpassword}

    depends_on:

      mysql:

        condition: service_healthy

    restart: unless-stopped


volumes:

  mysql_data:
